      ? navigator.serviceWorker.controller.scriptURL.replace(location.origin, '') : 'none';
    var regs = await navigator.serviceWorker.getRegistrations();
    o.regs = regs.map(function (r) {
      var w = r.active || r.installing || r.waiting;
      return w ? w.scriptURL.replace(location.origin, '') : 'pending';
    });
    o.caches = await caches.keys();
  } catch (e) { o.error = String(e); }
  document.getElementById('out').textContent = JSON.stringify(o);
  document.title = 'VERIFY:' + JSON.stringify(o);
})();
</script>
